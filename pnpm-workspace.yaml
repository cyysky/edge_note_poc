packages:
  - 'apps/*'
  - 'packages/*'

# Native modules that must run their install scripts (node-gyp / postinstall).
allowBuilds:
  better-sqlite3: true
  '@swc/core': true
  sharp: true

# Declared, tested exception: these ESLint plugins still cap their `eslint`
# peer at ^9 even though they lint cleanly on 10.x. Remove an entry once the
# plugin ships a matching peer range.
peerDependencyRules:
  allowedVersions:
    'eslint-plugin-import>eslint': '10'
    'eslint-plugin-jsx-a11y>eslint': '10'
    'eslint-plugin-react>eslint': '10'
